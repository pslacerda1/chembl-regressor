[workspace]
    channels = ["conda-forge"]
    platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

[dependencies]
    molfeat = ">=1.0.0,<2"
    click = ">=8.5.0,<9"
    scikit-learn = ">=1.9.1,<2"
    numpy = ">=2.5.4,<3"
    joblib = ">=1.6.0,<2"
    scipy = ">=1.18.1,<2"
    lightgbm = ">=4.7.0,<5"
    seaborn = ">=0.13.2,<0.14"
    matplotlib = ">=3.11.2,<4"
    pandas = ">=3.0.6,<4"

[pypi-dependencies]
    chembl-regressor = { path = ".", editable = true }
